kind = "web"
  previewPath = "/clypt-next/"
  title = "Clypt"
  version = "1.0.0"
  id = "artifacts/clypt-next"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/clypt-next/" ]
  localPort = 20241

  [services.development]
  run = "pnpm --filter @workspace/clypt-next run dev"

  [services.production]
  run = "pnpm --filter @workspace/clypt-next run start"
  build = [ "pnpm", "--filter", "@workspace/clypt-next", "run", "build" ]

  [services.env]
  PORT = "20241"
  BASE_PATH = "/clypt-next"
  NEXT_PUBLIC_BASE_PATH = "/clypt-next"
  